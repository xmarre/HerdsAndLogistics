name: Validate reconstructed source

on:
  push:
    branches:
      - agent/reconstruct-universal-build
    paths:
      - .github/workflows/reconstruct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Bannerlord ${{ matrix.game-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - game-version: 1.3.15
            reference-version: 1.3.15.110062
          - game-version: 1.4.7
            reference-version: 1.4.7.117484
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: >-
          dotnet build src/HerdsAndLogistics/HerdsAndLogistics.csproj
          --configuration Release
          --property:BannerlordReferenceVersion=${{ matrix.reference-version }}
          --property:OutputPath=${{ github.workspace }}/artifacts/compat/${{ matrix.game-version }}/
      - name: Reject TOR assembly dependency
        shell: bash
        run: |
          if strings artifacts/compat/${{ matrix.game-version }}/HerdsAndLogistics.dll | grep -Fq 'TOR_Core'; then
            echo 'Unexpected TOR_Core assembly reference found.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.game-version }}
          path: artifacts/compat/${{ matrix.game-version }}/HerdsAndLogistics.dll
          if-no-files-found: error

  package:
    name: Universal package
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build lowest supported API target
        run: >-
          dotnet build src/HerdsAndLogistics/HerdsAndLogistics.csproj
          --configuration Release
          --property:BannerlordReferenceVersion=1.3.15.110062
          --property:OutputPath=${{ github.workspace }}/artifacts/release-bin/
      - name: Assemble module
        shell: bash
        run: |
          set -euo pipefail
          module_root=artifacts/package/Modules/HerdsAndLogistics
          mkdir -p "$module_root/bin/Win64_Shipping_Client"
          cp module/SubModule.xml "$module_root/"
          cp module/README.md module/BALANCE.md module/CHANGELOG.md "$module_root/"
          cp artifacts/release-bin/HerdsAndLogistics.dll "$module_root/bin/Win64_Shipping_Client/"
          test ! -e "$module_root/bin/Win64_Shipping_Client/TOR_Core.dll"
          if find "$module_root" -type f -name 'TOR_Core.dll' | grep -q .; then
            echo 'Package must not contain TOR_Core.dll.' >&2
            exit 1
          fi
          (cd artifacts/package && zip -r -9 ../HerdsAndLogistics-v1.0.9-Universal-Bannerlord-1.3.15-to-1.4.7.zip Modules)
          sha256sum artifacts/HerdsAndLogistics-v1.0.9-Universal-Bannerlord-1.3.15-to-1.4.7.zip > artifacts/HerdsAndLogistics-v1.0.9-Universal-Bannerlord-1.3.15-to-1.4.7.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: HerdsAndLogistics-v1.0.9
          path: |
            artifacts/HerdsAndLogistics-v1.0.9-Universal-Bannerlord-1.3.15-to-1.4.7.zip
            artifacts/HerdsAndLogistics-v1.0.9-Universal-Bannerlord-1.3.15-to-1.4.7.zip.sha256
          if-no-files-found: error
